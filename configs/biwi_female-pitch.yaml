# Biwi Kinect female → male, pitch.  ResNet-50, L=4 (C=2048, S=7x7), N=2 → D=8192
source_dataset:
  name: biwi_kinect
  config: {gender: female, target: pitch}
  val_indices: configs/biwi-kinect_female_val_indices.npy
target_dataset:
  name: biwi_kinect
  config: {gender: male, target: pitch}
  train_ratio: 0.0

regressor:
  source: result/source/biwi_kinect/female_pitch/source_model_7400.pt
  type: image
  config: {backbone: resnet50, pretrained: false, in_channels: 3}

mhksa:
  layer: 4
  n_cells: 2
  adapter_ckpt: result/mhksa/biwi_female-pitch/lagm_adapter.pt
  adapter:
    beta_init: 0.0
    alpha_init: 4.0
    epochs: 5
    lr: 1.0e-2
    head_lr: 1.0e-3
    batch_size: 64
  encoder:
    n_heads: 4
    rff_dim: 256
    wiener_rank: 1000
    head_rank: 128
    final_rank: 100
    eta: 1.0
    m_range: [0.3, 3.0]
    bandwidth_mode: random
    cosine: false
    ridge_tau: 1.0e-4
    max_pca_samples: 4096
  stats_batch_size: 128
  num_workers: 4
  max_source_samples: null
  tta:
    train_mode: true
    eps: 1.0e-8
    optimizer:
      param: fe_bn
      name: Adam
      config: {lr: 0.001, weight_decay: 0.0}
    adapt_dataloader: {batch_size: 64, shuffle: true}
    val_dataloader: {batch_size: 256}
