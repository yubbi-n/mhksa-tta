# California Housing non-coastal → coastal. MLP(C=100), feature를 [C,1,1]로 취급, N=2 → D=400
source_dataset:
  name: calfornia_housing
  config: {source_domain: true, standardize: true}
  train_ratio: 0.9
target_dataset:
  name: calfornia_housing
  config: {source_domain: false, standardize: true}

regressor:
  source: result/source/calfornia_housing/source_model_25600.pt
  type: table
  config: {in_dims: 8, h_dims: 100, n_rep: 4}

mhksa:
  layer: null
  n_cells: 2
  adapter_ckpt: result/mhksa/california/lagm_adapter.pt
  adapter:
    beta_init: 0.0
    alpha_init: 0.0             # 문서: California처럼 GAP이 유리한 dataset → balanced
    epochs: 5
    lr: 1.0e-2
    head_lr: 1.0e-3
    batch_size: 256
  encoder:
    n_heads: 20
    rff_dim: 256
    wiener_rank: 32
    head_rank: 64
    final_rank: 100
    eta: 1.0
    m_range: [0.3, 3.0]
    bandwidth_mode: random
    cosine: false
    ridge_tau: 1.0e-4
    max_pca_samples: 4096
  stats_batch_size: 256
  num_workers: 0
  max_source_samples: null
  tta:                          # SSA 공식 california config: param fe, train_mode false, lr 1e-4
    train_mode: false
    eps: 1.0e-8
    optimizer:
      param: fe
      name: Adam
      config: {lr: 1.0e-4, weight_decay: 0.0}
    adapt_dataloader: {batch_size: 64, shuffle: true}
    val_dataloader: {batch_size: 256}
